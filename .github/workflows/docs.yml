name: Docs

on:
  push:
    branches:
      - main
    paths:              # redéployer seulement si la doc (ou ce qu'elle inclut) change
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"     # inclus dans le site via pymdownx.snippets
      - "src/**"        # docstrings -> API Reference
      - ".github/workflows/docs.yml"
  workflow_dispatch:    # déclenchement manuel possible

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for gh-pages push

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Une seule source de vérité pour les dépendances : l'extra [docs] de pyproject.toml.
      # `-e .` installe aussi le paquet, nécessaire pour que mkdocstrings importe les docstrings.
      - name: Install package + docs extras
        run: |
          pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build and deploy to GitHub Pages
        run: mkdocs gh-deploy --force
