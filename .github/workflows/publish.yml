name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Tag:              v$TAG_VERSION"
          echo "pyproject.toml:   $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pyproject.toml version ($PYPROJECT_VERSION). Bump pyproject.toml's version and commit it to main BEFORE tagging."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (prebuilt wheels for compiled deps)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: finufft numba llvmlite
          pip install -e ".[test]"
      - name: Run tests
        run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check package metadata
        run: |
          pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # requis pour Trusted Publishing (OIDC), ne pas omettre
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # requis pour créer une GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG.md section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Regex-escape dots in the version before matching a CHANGELOG.md
          # "## [X.Y.Z]" heading, so "0.1.2" doesn't loosely match "0X1X2".
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          awk -v ver="$ESCAPED_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "----- Extracted release notes -----"
          cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true   # appends an auto commit/PR list after the body above
          make_latest: "true"
          # If body_path ends up empty (e.g. CHANGELOG.md wasn't updated for
          # this tag), the release is still created with just the
          # auto-generated notes -- this step never blocks the release.